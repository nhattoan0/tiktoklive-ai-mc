<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đấu Trường Tu Tiên – Kiếm Tu vs Yêu Thú</title>
  <style>
    :root {
      --bg: #070b10;
      --panel: #101824;
      --gold: #f3c669;
      --jade: #2dd4bf;
      --red: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #132633 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 12px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .top h1 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--gold);
    }

    .badge {
      background: rgba(45, 212, 191, 0.16);
      border: 1px solid rgba(45, 212, 191, 0.4);
      color: var(--jade);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .arena-card {
      background: var(--panel);
      border: 1px solid rgba(243, 198, 105, 0.35);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 300px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
      background: rgba(7, 11, 16, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      margin-bottom: 5px;
    }

    .bar-bg {
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .bar-hero {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0d9488, #2dd4bf);
      transition: width 0.2s ease;
    }

    .bar-enemy {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #dc2626, #f87171);
      transition: width 0.2s ease;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: rgba(16, 24, 36, 0.98);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-slash {
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #ecfdf5;
      border-color: #5eead4;
    }

    .btn-sword {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827;
    }

    .btn-ult {
      background: linear-gradient(135deg, #a855f7, #6d28d9);
      color: #f5f3ff;
      border-color: #d8b4fe;
    }

    .btn-heal {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .log {
      padding: 10px 14px;
      font-size: 0.84rem;
      color: var(--gold);
      background: rgba(0, 0, 0, 0.28);
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .log span:last-child {
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      #gameCanvas {
        height: 240px;
      }
      .hud {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>⚔️ ĐẤU TRƯỜNG TU TIÊN: KIẾM TU vs YÊU THÚ</h1>
      <span id="stageBadge" class="badge">Ải 1 · Thắng: 0</span>
    </div>

    <div class="arena-card">
      <canvas id="gameCanvas" width="960" height="300"></canvas>

      <div class="hud">
        <div>
          <div class="bar-head">
            <span><strong>Thanh Vân Kiếm Tu</strong></span>
            <span id="heroHpText">120 / 120 HP</span>
          </div>
          <div class="bar-bg"><div id="heroHpBar" class="bar-hero"></div></div>
        </div>
        <div>
          <div class="bar-head">
            <span><strong id="enemyNameText">Hắc Diệm Ma Lang</strong></span>
            <span id="enemyHpText">120 / 120 HP</span>
          </div>
          <div class="bar-bg"><div id="enemyHpBar" class="bar-enemy"></div></div>
        </div>
      </div>

      <div class="controls">
        <button id="btnSlash" class="btn-slash">⚔️ Thanh Phong Trảm</button>
        <button id="btnSwordWave" class="btn-sword">🗡️ Vạn Kiếm Quy Tông</button>
        <button id="btnUlt" class="btn-ult">⚡ Cửu Thiên Lôi Kiếp</button>
        <button id="btnHeal" class="btn-heal">🧪 Phục Linh Đan (+35 HP)</button>
      </div>

      <div class="log">
        <span id="battleLog">Kiếm tu đã vào trận! Chọn chiêu thức để giao chiến.</span>
        <span id="comboText">Liên kích: 0</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const enemies = [
      { name: "Hắc Diệm Ma Lang", maxHp: 120, fur: "#1e293b", accent: "#ef4444", horn: "#f87171", dmg: 14 },
      { name: "Xích Viêm Yêu Tướng", maxHp: 160, fur: "#451a1a", accent: "#fb923c", horn: "#fde047", dmg: 18 },
      { name: "U Minh Cự Thú", maxHp: 210, fur: "#1e1b4b", accent: "#c084fc", horn: "#67e8f9", dmg: 22 }
    ];

    const state = {
      tick: 0,
      wins: 0,
      combo: 0,
      enemyIndex: 0,
      heroHp: 120,
      heroMaxHp: 120,
      enemyHp: 120,
      enemyMaxHp: 120,
      heroX: 230,
      enemyX: 710,
      heroDash: 0,
      enemyDash: 0,
      heroSwing: 0,
      enemySwing: 0,
      heroFlash: 0,
      enemyFlash: 0,
      lightning: 0,
      projectiles: [],
      slashes: [],
      sparks: [],
      popups: []
    };

    function $(id) {
      return document.getElementById(id);
    }

    function setLog(msg) {
      $("battleLog").textContent = msg;
    }

    function updateHUD() {
      const enemy = enemies[state.enemyIndex % enemies.length];
      $("enemyNameText").textContent = enemy.name;
      $("heroHpText").textContent = `${Math.max(0, state.heroHp)} / ${state.heroMaxHp} HP`;
      $("enemyHpText").textContent = `${Math.max(0, state.enemyHp)} / ${state.enemyMaxHp} HP`;
      $("heroHpBar").style.width = `${Math.max(0, (state.heroHp / state.heroMaxHp) * 100)}%`;
      $("enemyHpBar").style.width = `${Math.max(0, (state.enemyHp / state.enemyMaxHp) * 100)}%`;
      $("stageBadge").textContent = `Ải ${state.enemyIndex + 1} · Thắng: ${state.wins}`;
      $("comboText").textContent = `Liên kích: ${state.combo}`;
    }

    function addPopup(text, x, y, color) {
      state.popups.push({ text, x, y, color, alpha: 1, vy: -1.4 });
    }

    function addSparks(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const spd = 2 + Math.random() * 5;
        state.sparks.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.5,
          color,
          life: 24 + Math.floor(Math.random() * 12)
        });
      }
    }

    function spawnEnemy() {
      state.enemyIndex += 1;
      const next = enemies[state.enemyIndex % enemies.length];
      state.enemyMaxHp = next.maxHp;
      state.enemyHp = next.maxHp;
      addPopup(`${next.name} xuất hiện!`, 690, 95, "#f3c669");
      updateHUD();
    }

    function applyDamageToEnemy(dmg, label, color) {
      state.enemyHp -= dmg;
      state.enemyFlash = 10;
      state.enemyDash = 26;
      state.combo += 1;
      addPopup(`${label} -${dmg}`, state.enemyX, 110, color);
      addSparks(state.enemyX - 20, 165, color, 16);

      if (state.enemyHp <= 0) {
        state.wins += 1;
        state.heroHp = Math.min(state.heroMaxHp, state.heroHp + 20);
        setLog(`Hạ gục ${enemies[state.enemyIndex % enemies.length].name}! Hồi 20 HP và tiến sang ải mới.`);
        spawnEnemy();
      }
      updateHUD();
    }

    function enemyTurn() {
      if (state.enemyHp <= 0) return;
      const enemy = enemies[state.enemyIndex % enemies.length];
      state.enemySwing = 16;
      state.enemyDash = -42;

      setTimeout(() => {
        if (state.enemyHp <= 0) return;
        state.heroFlash = 10;
        state.heroDash = -22;
        state.heroHp = Math.max(0, state.heroHp - enemy.dmg);
        state.slashes.push({ x: state.heroX + 10, y: 165, dir: -1, color: enemy.accent, life: 12 });
        addPopup(`-${enemy.dmg}`, state.heroX, 115, "#f87171");
        addSparks(state.heroX + 10, 165, enemy.accent, 12);

        if (state.heroHp <= 0) {
          state.heroHp = state.heroMaxHp;
          state.combo = 0;
          setLog("Kiếm tu trọng thương nhưng linh hồn bất diệt, tụ khí hồi sinh đầy HP!");
          addPopup("HỒI SINH!", state.heroX, 90, "#2dd4bf");
        } else {
          setLog(`${enemy.name} vung vuốt phản đòn gây ${enemy.dmg} sát thương!`);
        }
        updateHUD();
      }, 240);
    }

    function heroSlash() {
      state.heroDash = 55;
      state.heroSwing = 16;
      state.slashes.push({ x: state.enemyX - 25, y: 165, dir: 1, color: "#2dd4bf", life: 14 });
      applyDamageToEnemy(24, "⚔️", "#2dd4bf");
      setLog("Kiếm tu lướt tới tung Thanh Phong Trảm!");
      if (state.enemyHp > 0) setTimeout(enemyTurn, 420);
    }

    function heroSwordWave() {
      state.heroDash = 22;
      state.heroSwing = 14;
      state.projectiles.push({
        x: state.heroX + 45,
        y: 162,
        vx: 13,
        dmg: 36,
        color: "#f3c669",
        label: "🗡️"
      });
      setLog("Kiếm tu phóng ra Kiếm Khí Vạn Quân!");
    }

    function heroLightning() {
      state.heroDash = 16;
      state.lightning = 18;
      applyDamageToEnemy(48, "⚡", "#e879f9");
      setLog("Cửu Thiên Lôi Kiếp giáng xuống đỉnh đầu yêu thú!");
      if (state.enemyHp > 0) setTimeout(enemyTurn, 460);
    }

    function heroHeal() {
      state.heroHp = Math.min(state.heroMaxHp, state.heroHp + 35);
      state.combo = 0;
      addPopup("+35 HP", state.heroX, 105, "#2dd4bf");
      addSparks(state.heroX, 170, "#2dd4bf", 14);
      setLog("Kiếm tu nuốt Phục Linh Đan, linh lực dồi dào trở lại!");
      updateHUD();
      setTimeout(enemyTurn, 420);
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#0b1524");
      grad.addColorStop(0.65, "#112233");
      grad.addColorStop(1, "#090d14");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Vầng trăng / linh khí sau lưng
      ctx.save();
      ctx.fillStyle = "rgba(243, 198, 105, 0.08)";
      ctx.beginPath();
      ctx.arc(canvas.width / 2, 125, 92, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Nền đá đấu trường
      ctx.fillStyle = "#162436";
      ctx.fillRect(0, 225, canvas.width, 75);
      ctx.strokeStyle = "rgba(243, 198, 105, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 225);
      ctx.lineTo(canvas.width, 225);
      ctx.stroke();
    }

    function drawSwordImmortal(x, y) {
      const breathe = Math.sin(state.tick * 0.08) * 3;
      ctx.save();
      ctx.translate(x, y + breathe);

      if (state.heroFlash > 0) ctx.filter = "brightness(2)";

      // Bóng dưới chân
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.beginPath();
      ctx.ellipse(0, 56, 36, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Tóc dài bay phía sau
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-6, -34);
      ctx.quadraticCurveTo(-34, -22, -46, 4 + Math.sin(state.tick * 0.14) * 6);
      ctx.stroke();

      // Vạt áo bào tiên tu
      ctx.fillStyle = "#0f766e";
      ctx.beginPath();
      ctx.moveTo(-18, 50);
      ctx.lineTo(-6, -12);
      ctx.lineTo(14, -12);
      ctx.lineTo(24, 50);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#5eead4";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Đai ngọc vàng kim
      ctx.fillStyle = "#f3c669";
      ctx.fillRect(-12, 14, 26, 6);

      // Đầu & vương quan
      ctx.fillStyle = "#fde68a";
      ctx.beginPath();
      ctx.arc(4, -26, 13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f3c669";
      ctx.beginPath();
      ctx.moveTo(-4, -37);
      ctx.lineTo(4, -49);
      ctx.lineTo(12, -37);
      ctx.closePath();
      ctx.fill();

      // Tay & trường kiếm
      ctx.save();
      ctx.translate(12, 0);
      const swingAngle = state.heroSwing > 0 ? -1.15 + (16 - state.heroSwing) * 0.14 : -0.35;
      ctx.rotate(swingAngle);

      ctx.strokeStyle = "#99f6e4";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(46, 0);
      ctx.stroke();

      ctx.fillStyle = "#f3c669";
      ctx.fillRect(4, -6, 5, 12);
      ctx.restore();

      // Phi kiếm bay lơ lửng quanh người
      const swordOrbitY = -58 + Math.cos(state.tick * 0.09) * 5;
      ctx.strokeStyle = "#2dd4bf";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-26, swordOrbitY);
      ctx.lineTo(16, swordOrbitY - 6);
      ctx.stroke();

      ctx.restore();
    }

    function drawMonster(x, y) {
      const enemy = enemies[state.enemyIndex % enemies.length];
      const breathe = Math.cos(state.tick * 0.08) * 3.5;
      ctx.save();
      ctx.translate(x, y + breathe);

      if (state.enemyFlash > 0) ctx.filter = "brightness(2)";

      // Bóng dưới chân
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.beginPath();
      ctx.ellipse(0, 56, 44, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Đuôi yêu thú
      ctx.strokeStyle = enemy.accent;
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(22, 30);
      ctx.quadraticCurveTo(54, 14 + Math.sin(state.tick * 0.12) * 8, 62, -6);
      ctx.stroke();

      // Thân yêu thú
      ctx.fillStyle = enemy.fur;
      ctx.beginPath();
      ctx.moveTo(-28, 52);
      ctx.lineTo(-16, -18);
      ctx.lineTo(22, -18);
      ctx.lineTo(30, 52);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = enemy.accent;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Đầu yêu thú & sừng
      ctx.fillStyle = enemy.fur;
      ctx.beginPath();
      ctx.arc(-6, -28, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = enemy.horn;
      ctx.beginPath();
      ctx.moveTo(-14, -40);
      ctx.lineTo(-26, -58);
      ctx.lineTo(-4, -43);
      ctx.closePath();
      ctx.fill();

      // Mắt phát sáng
      ctx.fillStyle = "#fde047";
      ctx.beginPath();
      ctx.arc(-13, -30, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Vuốt yêu thú
      ctx.save();
      ctx.translate(-18, 4);
      const clawAngle = state.enemySwing > 0 ? 1.0 - (16 - state.enemySwing) * 0.12 : 0.25;
      ctx.rotate(clawAngle);
      ctx.strokeStyle = enemy.horn;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-34, 8);
      ctx.moveTo(-24, 6);
      ctx.lineTo(-36, 18);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function updateAndDrawEffects() {
      // Kiếm khí bay ngang
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const p = state.projectiles[i];
        p.x += p.vx;

        ctx.save();
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 24, -0.8, 0.8);
        ctx.stroke();
        ctx.restore();

        if (p.x >= state.enemyX - 25) {
          applyDamageToEnemy(p.dmg, p.label, p.color);
          state.projectiles.splice(i, 1);
          if (state.enemyHp > 0) setTimeout(enemyTurn, 380);
        }
      }

      // Vệt chém
      for (let i = state.slashes.length - 1; i >= 0; i--) {
        const s = state.slashes[i];
        s.life -= 1;
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.life / 14);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        if (s.dir === 1) ctx.arc(s.x, s.y, 42, -1.1, 1.1);
        else ctx.arc(s.x, s.y, 42, Math.PI - 1.1, Math.PI + 1.1);
        ctx.stroke();
        ctx.restore();
        if (s.life <= 0) state.slashes.splice(i, 1);
      }

      // Tia lôi kiếp
      if (state.lightning > 0) {
        state.lightning -= 1;
        ctx.save();
        ctx.strokeStyle = "#f0abfc";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(state.enemyX - 24, 0);
        ctx.lineTo(state.enemyX + 12, 70);
        ctx.lineTo(state.enemyX - 14, 125);
        ctx.lineTo(state.enemyX + 6, 185);
        ctx.stroke();
        ctx.restore();
      }

      // Tia lửa
      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const sp = state.sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vy += 0.18;
        sp.life -= 1;

        ctx.fillStyle = sp.color;
        ctx.fillRect(sp.x, sp.y, 4, 4);
        if (sp.life <= 0) state.sparks.splice(i, 1);
      }

      // Chữ sát thương
      for (let i = state.popups.length - 1; i >= 0; i--) {
        const pop = state.popups[i];
        pop.y += pop.vy;
        pop.alpha -= 0.022;

        ctx.save();
        ctx.globalAlpha = Math.max(0, pop.alpha);
        ctx.fillStyle = pop.color;
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();

        if (pop.alpha <= 0) state.popups.splice(i, 1);
      }
    }

    function loop() {
      state.tick += 1;
      state.heroDash *= 0.82;
      state.enemyDash *= 0.82;
      if (state.heroSwing > 0) state.heroSwing -= 1;
      if (state.enemySwing > 0) state.enemySwing -= 1;
      if (state.heroFlash > 0) state.heroFlash -= 1;
      if (state.enemyFlash > 0) state.enemyFlash -= 1;

      drawBackground();
      drawSwordImmortal(state.heroX + state.heroDash, 165);
      drawMonster(state.enemyX + state.enemyDash, 165);
      updateAndDrawEffects();

      requestAnimationFrame(loop);
    }

    $("btnSlash").addEventListener("click", heroSlash);
    $("btnSwordWave").addEventListener("click", heroSwordWave);
    $("btnUlt").addEventListener("click", heroLightning);
    $("btnHeal").addEventListener("click", heroHeal);

    updateHUD();
    loop();
  </script>
</body>
</html>
